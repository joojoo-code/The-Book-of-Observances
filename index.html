<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eee5d2">
<title>The Book of Observances</title>
<style>
:root{--paper:#eee5d2;--paper2:#e5d9c1;--ink:#302d25;--muted:#716b5d;--rule:#b9ad95;--red:#783e35;--red2:#a36d5a;--white:rgba(255,252,243,.46);--serif:Georgia,'Times New Roman',serif;--sans:'Palatino Linotype',Palatino,serif;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;background-image:radial-gradient(ellipse at 12% 4%,rgba(255,255,255,.38),transparent 38%),radial-gradient(ellipse at 92% 80%,rgba(137,111,75,.07),transparent 40%)}
a{color:inherit}button{font:inherit;color:inherit}.frame{max-width:1180px;margin:auto;padding:0 42px}.topline{height:8px;background:var(--red)}header{border-bottom:1px solid var(--rule)}.masthead{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:23px 0 20px}.brand{font-family:var(--serif);font-size:14px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.brand span{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:2px}.edition{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}.nav{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule)}.nav button{border:0;background:transparent;padding:12px 17px 12px 0;margin-right:24px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.nav button:hover,.nav button.active{color:var(--red);border-bottom-color:var(--red)}main{min-height:72vh}.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);font-weight:bold}.hero{padding:70px 0 56px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:70px;align-items:end}.hero h1{font:normal clamp(44px,6vw,76px)/.99 var(--serif);letter-spacing:-.045em;margin:18px 0 23px;max-width:740px}.hero .dek{font:italic 21px/1.5 var(--serif);max-width:630px;color:#514b40;margin:0}.seal{border-left:1px solid var(--rule);padding:8px 0 8px 26px;color:var(--muted);font-size:13px}.seal strong{display:block;font:normal 19px/1.3 var(--serif);color:var(--ink);margin:8px 0 12px}.seal .number{font:normal 52px/1 var(--serif);color:var(--red2)}.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;padding:32px 0 60px;border-top:1px solid var(--rule)}h2{font:normal 32px/1.15 var(--serif);letter-spacing:-.02em;margin:10px 0 18px}h3{font:normal 22px/1.25 var(--serif);margin:0 0 8px}p{margin:0 0 15px}.smallnote{font-size:13px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:0}.section-head .count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.category-list{border-top:1px solid var(--rule)}.category{display:grid;grid-template-columns:64px minmax(0,1fr) 180px;gap:22px;padding:25px 0 27px;border-bottom:1px solid var(--rule);align-items:start}.category .num{font:normal 29px/1 var(--serif);color:var(--red2);padding-top:4px}.category h3 a{text-decoration:none}.category h3 a:hover{color:var(--red)}.category .description{color:#5e584c;max-width:660px;font-size:14px}.category .meta{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:right;padding-top:8px}.text-link{display:inline-block;text-decoration:none;border-bottom:1px solid var(--red2);color:var(--red);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding-bottom:2px;margin-top:7px}.text-link:hover{border-bottom-width:2px}.closing{padding:43px 0 58px;border-top:1px solid var(--rule);margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:70px}.closing blockquote{font:italic 24px/1.4 var(--serif);margin:0;color:#554b3d}.page-head{padding:55px 0 38px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:45px;align-items:end}.page-head h1{font:normal clamp(40px,5vw,62px)/1.02 var(--serif);letter-spacing:-.04em;margin:12px 0 17px}.page-head .dek{font:italic 19px/1.5 var(--serif);color:#5a5347;max-width:700px}.page-index{border-left:1px solid var(--rule);padding-left:20px;color:var(--muted);font-size:12px}.page-index b{display:block;font:normal 35px/1 var(--serif);color:var(--red2);margin-bottom:8px}.page-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;padding:38px 0 60px}.side-index{border-right:1px solid var(--rule);padding-right:24px}.side-index .label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:13px}.side-index a{display:block;text-decoration:none;font-size:13px;line-height:1.4;padding:9px 0;border-bottom:1px solid rgba(185,173,149,.65)}.side-index a:hover{color:var(--red)}.content-section{padding:0 0 34px;margin:0 0 34px;border-bottom:1px solid var(--rule)}.content-section:last-child{border-bottom:0}.content-section h2{font-size:29px}.content-section p{max-width:760px}.register{margin-top:22px;border-top:1px solid var(--rule)}.record-row{display:grid;grid-template-columns:48px minmax(0,1fr) 110px;gap:17px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}.record-row .record-no{font:normal 22px/1.2 var(--serif);color:var(--red2)}.record-row h3{font-size:20px}.record-row p{font-size:13px;color:#625b4f;margin:0;max-width:650px}.record-row .status{text-align:right;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:6px}.record-row button{background:none;border:0;border-bottom:1px solid var(--red2);padding:0 0 2px;margin-top:8px;color:var(--red);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.record-row button:hover{border-bottom-width:2px}.notice{background:rgba(255,252,243,.38);border-left:2px solid var(--red2);padding:17px 21px;margin:20px 0;max-width:760px;font-size:13px}.notice strong{font-family:var(--serif);font-size:17px;font-weight:normal;display:block;margin-bottom:4px}.record-detail{display:none;padding:20px 22px;background:rgba(255,252,243,.45);border-bottom:1px solid var(--rule);font-size:13px}.record-detail.open{display:block}.record-detail h4{font:normal 19px var(--serif);margin:0 0 6px}.record-detail dl{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;margin:15px 0 0}.record-detail dt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.record-detail dd{margin:0}.colophon{padding:27px 0 35px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.colophon strong{font-weight:normal;color:var(--red)}.back{display:inline-block;margin-top:20px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--red);text-decoration:none;border-bottom:1px solid var(--red2)}.mobile-menu{display:none}
@media(max-width:760px){.frame{padding:0 22px}.masthead{align-items:flex-start}.edition{max-width:120px;font-size:9px}.nav button{font-size:10px;margin-right:15px;padding:11px 0}.hero{padding:48px 0 36px;grid-template-columns:1fr;gap:30px}.hero h1{font-size:54px}.seal{border-left:0;border-top:1px solid var(--rule);padding:20px 0 0;display:grid;grid-template-columns:60px 1fr;column-gap:15px}.seal .number{grid-row:span 2;font-size:42px}.seal strong{margin:0 0 5px}.intro-grid,.closing{grid-template-columns:1fr;gap:28px}.category{grid-template-columns:37px 1fr;gap:13px}.category .meta{grid-column:2;text-align:left;padding:0}.page-head{grid-template-columns:1fr;gap:22px;padding-top:42px}.page-index{border-left:0;border-top:1px solid var(--rule);padding:13px 0 0;display:flex;gap:12px;align-items:center}.page-index b{font-size:26px;margin:0}.page-body{grid-template-columns:1fr;gap:28px;padding-top:25px}.side-index{border-right:0;border-bottom:1px solid var(--rule);padding:0 0 20px}.side-index nav{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.record-row{grid-template-columns:32px 1fr;gap:12px}.record-row .status{grid-column:2;text-align:left;padding-top:0}.record-detail dl{grid-template-columns:1fr;gap:3px}.record-detail dd{margin-bottom:9px}.colophon{flex-direction:column;gap:8px}.section-head{align-items:flex-start;flex-direction:column;gap:5px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body><div class="topline"></div>
<header><div class="frame"><div class="masthead"><a href="#home" class="brand" data-page="home">The Book of Observances<span>A compilation of the Keepers</span></a><div class="edition">An old record<br>Preserved without addition</div></div><nav class="nav" aria-label="Main navigation" id="mainNav"></nav></div></header>
<main class="frame" id="app" tabindex="-1"></main>
<footer class="frame"><div class="colophon"><span><strong>The Book of Observances</strong> · Keeper compilation</span><span>Names unrecorded · Accounts preserved</span></div></footer>
<script>
const categories=[
{id:'healing',num:'I',name:'Healing and Restoration',short:'The return of what has been weakened, disturbed, or lost.',dek:'Observances concerned with recovery, renewal, and the restoration of spiritual condition.',intro:'This division gathers accounts of observances undertaken when spiritual strength has diminished, balance has been disturbed, or a person’s awareness and abilities have been impaired. The records describe practices intended to restore what can be restored, and distinguish those conditions for which the outcome remains uncertain.',scope:'The accounts are arranged by the condition an observance is meant to address, rather than by the House in which it is practised. Similar purposes do not necessarily indicate identical methods. Requirements, participants, materials, and limits belong to each individual record.',subjects:[
['Restoration of spiritual strength','Observances recorded for states of spiritual exhaustion, depletion, or diminished capacity.'],
['Restoration of spiritual balance','Practices associated with a spiritual condition understood to have fallen out of balance.'],
['Recovery from spiritual afflictions','Accounts concerning recovery from spiritual disturbances or afflictions.'],
['Restoration of awareness and ability','Records involving disturbed spiritual awareness, impaired abilities, or damaged spiritual connections.'],
['Recovery following an observance','Accounts of lingering effects after an observance, including cases in which the intended result was incomplete.'],
['Restoration following spiritual intrusion','Records concerning recovery after an unwanted spiritual presence or intrusion, including weakened or severed bonds.']],note:'A record of intended restoration is not proof that restoration will always occur. Where no failure is known, the archive says so only as far as the surviving accounts permit.'},
{id:'protection',num:'II',name:'Protection and Preservation',short:'The keeping safe of persons, places, bonds, and spiritual conditions.',dek:'Observances concerned with guarding, maintaining, and preserving against spiritual harm or disruption.',intro:'This division gathers accounts of observances undertaken to protect what is considered vulnerable, to preserve an existing condition, or to maintain a boundary against disturbance. The record attends to what an observance is meant to safeguard, the circumstances in which protection is sought, and the limits that have been observed.',scope:'Protection is not treated as a single method or a guarantee of safety. The form and reach of an observance are recorded separately in each account, where known. A practice that guards one person, place, or bond should not be assumed to serve another purpose without evidence.',subjects:[['Protection of persons','Observances intended to guard an individual against spiritual danger or disturbance.'],['Safeguarding places','Records concerning the protection or preservation of a dwelling, site, or place of spiritual importance.'],['Preservation of spiritual bonds','Practices intended to maintain a connection, allegiance, or bond against disruption.'],['Warding and boundaries','Accounts of observances that establish or maintain a spiritual boundary.'],['Continuance of protection','Records concerning the renewal, duration, or maintenance of an existing protection.'],['Limits and breaches','Accounts of protections that weakened, were crossed, or did not produce a known result.']],note:'The existence of a protective observance does not establish the extent of its protection. Each account must be read according to its recorded purpose and evidence.'},
{id:'communion',num:'III',name:'Communion and Invocation',short:'The seeking of contact, response, or presence beyond the self.',dek:'Observances concerned with calling, addressing, or seeking communion with spiritual presences.',intro:'This division gathers accounts of observances through which practitioners seek to address, call upon, or enter communion with a spiritual presence. The records distinguish the intended recipient, the purpose of the approach, and what—if anything—was observed in response.',scope:'An invocation is not, by itself, evidence of an answer. The archive records reported signs and outcomes without treating expectation as confirmation. Where the identity of a presence, the nature of a response, or the success of an observance remains uncertain, that uncertainty is retained.',subjects:[['Invocation and calling','Accounts of observances intended to call or address a spiritual presence.'],['Seeking communion','Practices intended to establish or enter a form of spiritual communication.'],['Requests and petitions','Observances through which a practitioner seeks aid, permission, guidance, or intervention.'],['Receiving a response','Records concerning signs interpreted as answers, including the limits of such interpretations.'],['Witness and mediation','Accounts in which another person, role, or spiritual intermediary is involved.'],['Silence and uncertain outcomes','Records where no response was observed, or where the outcome could not be established.']],note:'The archive distinguishes what a practitioner sought, what witnesses observed, and what later accounts concluded. These are not always the same.'},
{id:'passage',num:'IV',name:'Passage and Transition',short:'The marking of thresholds, departures, and changes of state.',dek:'Observances associated with crossing from one condition, status, or stage into another.',intro:'This division gathers accounts of observances connected with passage: moments in which a person, bond, or condition is understood to cross a threshold or undergo a significant change. Such records may concern preparation, the passage itself, or the recognition of a transition after it has occurred.',scope:'The archive does not assume that every transition follows the same order or carries the same meaning across the Spiritual Houses. Each record preserves the tradition and circumstances observed, while leaving unrecorded what cannot be established from surviving accounts.',subjects:[['Preparation for passage','Observances performed before a recognised transition or crossing.'],['Rites of transition','Accounts of practices marking a change of state, standing, or spiritual condition.'],['Crossing thresholds','Records associated with boundaries between places, conditions, or stages.'],['Departure and separation','Observances connected with leaving, parting, or the ending of a former state.'],['Arrival and recognition','Practices through which a transition or new condition is acknowledged.'],['Interrupted or uncertain passage','Accounts in which a transition was delayed, incomplete, or not clearly understood.']],note:'The word “passage” follows the terminology of the recorded tradition. It does not, on its own, establish what lies beyond a threshold or what a transition will bring.'},
{id:'reconciliation',num:'V',name:'Reconciliation and Release',short:'The mending of division and the loosening of what remains bound.',dek:'Observances concerned with restoring accord, easing a bond, or bringing a spiritual matter to its close.',intro:'This division gathers accounts of observances intended to address spiritual discord, restore a damaged accord, release a bond, or bring an unresolved condition to an end. The records preserve the stated purpose of each practice without assuming that reconciliation, release, and separation are interchangeable outcomes.',scope:'An observance may seek repair, closure, or release, and these purposes need not produce the same result. Where an account does not establish whether a bond was restored, loosened, or ended, the record leaves that distinction unresolved.',subjects:[['Restoring accord','Practices intended to address a spiritual disagreement or restore a disrupted relationship.'],['Mending damaged bonds','Accounts concerning a spiritual connection understood to have been strained or harmed.'],['Release from a bond','Observances intended to loosen or end a binding connection.'],['Resolution of lingering influence','Records concerning the easing or conclusion of an ongoing spiritual effect.'],['Closure and completion','Practices marking the conclusion of an unresolved spiritual matter.'],['Failed or incomplete reconciliation','Accounts in which accord or release was not achieved, or the result remains unknown.']],note:'A record of intended release does not establish that every bond can be ended, just as an attempt at reconciliation does not establish that accord was restored.'}
];
let current='home';
const app=document.getElementById('app'), nav=document.getElementById('mainNav');
function makeNav(){nav.innerHTML='<button data-page="home" class="'+(current==='home'?'active':'')+'">The Register</button>'+categories.map(c=>'<button data-page="'+c.id+'" class="'+(current===c.id?'active':'')+'">'+c.num+'. '+c.name+'</button>').join('');}
function home(){return `<section class="hero"><div><div class="eyebrow">The Keeper's compilation · Complete</div><h1>The Book of<br>Observances</h1><p class="dek">A record of spiritual practices gathered through observation and preserved across centuries.</p></div><aside class="seal"><div class="number">∞</div><div><strong>Names unrecorded.<br>Work preserved.</strong><p>The compilation stands as it was left. No further accounts have been entered since its completion.</p></div></aside></section>
<section class="intro-grid"><div><div class="eyebrow">On this record</div><h2>What has been kept</h2><p>The practices recorded herein were gathered through observation and preserved in the writings of the Keepers across centuries. Within this compilation are set down the observances of the Spiritual Houses, the manners of their performance, and the purposes for which they are undertaken.</p><p>These writings were gathered by those who came before, their names unrecorded, their work preserved. The compilation has remained unchanged for centuries, and no further accounts have been entered since its completion.</p></div><div><div class="eyebrow">How it is arranged</div><h2>By purpose, not by origin</h2><p>The register is divided according to the purpose an observance is meant to serve. Practices found in one House may also be known elsewhere; their presence in a division does not imply that the practice belongs exclusively to a single people or place.</p><p>Each account is preserved according to what was observed or reported. Known variations are distinguished where the record allows it. Matters not established by the surviving accounts remain uncertain.</p><div class="notice"><strong>A note on the limits of the record</strong>The absence of an account is not proof that a practice does not exist. Nor does a recorded intention guarantee a particular outcome.</div></div></section>
<section><div class="section-head"><div><div class="eyebrow">The register</div><h2>Divisions of observance</h2></div><span class="count">Five divisions</span></div><div class="category-list">${categories.map(c=>`<article class="category"><div class="num">${c.num}</div><div><h3><a href="#${c.id}" data-page="${c.id}">${c.name}</a></h3><p class="description">${c.short} ${c.dek}</p><a class="text-link" href="#${c.id}" data-page="${c.id}">Enter division</a></div><div class="meta">Division ${c.num}<br>Subject register</div></article>`).join('')}</div></section>
<section class="closing"><blockquote>“Thus stands the record, as it was left to those who would come after.”</blockquote><div><div class="eyebrow">Preservation</div><h2>What is known, and what is not</h2><p>The Keepers’ task was to observe and preserve, not to complete every account. Some practices are recorded in detail; others survive only in fragments. A failure may be known, a success may be reported, or no outcome may have been witnessed at all.</p><p class="smallnote">The record retains these distinctions. It does not supply certainty where none was preserved.</p></div></section>`}
function categoryPage(c){return `<section class="page-head"><div><div class="eyebrow">Division ${c.num} · The Book of Observances</div><h1>${c.name}</h1><p class="dek">${c.dek}</p></div><aside class="page-index"><b>${c.num}</b><span>Division of the<br>Keeper's register</span></aside></section>
<div class="page-body"><aside class="side-index"><div class="label">Within this division</div><nav>${[['overview','Purpose of the division'],['subjects','Subject register'],['limits','Limits of the record']].map(([id,label])=>`<a href="#${id}">${label}</a>`).join('')}</nav><a class="back" href="#home" data-page="home">Return to register</a></aside><div class="page-content">
<section class="content-section" id="overview"><div class="eyebrow">Purpose of the division</div><h2>On ${c.name.toLowerCase()}</h2><p>${c.intro}</p><p>${c.scope}</p></section>
<section class="content-section" id="subjects"><div class="eyebrow">Subject register</div><h2>Accounts gathered under this purpose</h2><p class="smallnote">The entries below identify the kinds of observances recorded in this division. Each subject may contain more than one practice, tradition, or surviving account.</p><div class="register">${c.subjects.map((s,i)=>`<article class="record-row"><div class="record-no">${String(i+1).padStart(2,'0')}</div><div><h3>${s[0]}</h3><p>${s[1]}</p><button aria-expanded="false" data-detail="${c.id}-${i}">Open subject note</button></div><div class="status">Subject<br>classification</div></article><div class="record-detail" id="detail-${c.id}-${i}"><h4>${s[0]}</h4><p>${s[1]}</p><dl><dt>Purpose</dt><dd>As described in the subject classification above.</dd><dt>Specific observances</dt><dd>No individual observance is established on this page. Separate accounts are to be entered only when their details have been defined.</dd><dt>Recorded limits</dt><dd>Requirements, materials, practitioners, procedure, and outcomes are recorded with each individual observance where known. Unknown details remain unrecorded.</dd></dl></div>`).join('')}</div></section>
<section class="content-section" id="limits"><div class="eyebrow">The surviving evidence</div><h2>Limits of the record</h2><p>${c.note}</p><div class="notice"><strong>On incomplete accounts</strong>Where a detail was not observed or no account survives, the record may state that the matter is unknown. For example: “No account of failure survives in the available records,” or “The consequences of an interrupted observance remain unrecorded.” Such statements describe the archive, not a universal certainty.</div><p class="smallnote">Individual observance records may include practitioner, participants, materials, procedure, signs, variations, cost or rarity of requirements, known failures, and consequences. No field is compulsory when the surviving record cannot support it.</p></section>
</div></div>`}
function render(page){current=page;makeNav();app.innerHTML=page==='home'?home():categoryPage(categories.find(c=>c.id===page)||categories[0]);app.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){e.preventDefault();render(p.dataset.page);history.replaceState(null,'','#'+p.dataset.page);return;}const d=e.target.closest('[data-detail]');if(d){const el=document.getElementById('detail-'+d.dataset.detail);const open=el.classList.toggle('open');d.setAttribute('aria-expanded',String(open));d.textContent=open?'Close subject note':'Open subject note';}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='home'||categories.some(c=>c.id===id))render(id||'home')});
render(categories.some(c=>c.id===location.hash.slice(1))?location.hash.slice(1):'home');
</script></body></html>
