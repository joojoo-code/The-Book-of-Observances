a{color:inherit}button{font:inherit;color:inherit}.frame{max-width:1180px;margin:auto;padding:0 42px}.topline{height:8px;background:var(--red)}header{border-bottom:1px solid var(--rule)}.masthead{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:23px 0 20px}.brand{font-family:var(--serif);font-size:14px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.brand span{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:2px}.edition{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}.nav{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule)}.nav button{border:0;background:transparent;padding:12px 17px 12px 0;margin-right:24px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.nav button:hover,.nav button.active{color:var(--red);border-bottom-color:var(--red)}main{min-height:72vh}.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);font-weight:bold}.hero{padding:70px 0 56px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:70px;align-items:end}.hero h1{font:normal clamp(44px,6vw,76px)/.99 var(--serif);letter-spacing:-.045em;margin:18px 0 23px;max-width:740px}.hero .dek{font:italic 21px/1.5 var(--serif);max-width:630px;color:#514b40;margin:0}.seal{border-left:1px solid var(--rule);padding:8px 0 8px 26px;color:var(--muted);font-size:13px}.seal strong{display:block;font:normal 19px/1.3 var(--serif);color:var(--ink);margin:8px 0 12px}.seal .number{font:normal 52px/1 var(--serif);color:var(--red2)}.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;padding:32px 0 60px;border-top:1px solid var(--rule)}h2{font:normal 32px/1.15 var(--serif);letter-spacing:-.02em;margin:10px 0 18px}h3{font:normal 22px/1.25 var(--serif);margin:0 0 8px}p{margin:0 0 15px}.smallnote{font-size:13px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:0}.section-head .count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.category-list{border-top:1px solid var(--rule)}.category{display:grid;grid-template-columns:64px minmax(0,1fr) 180px;gap:22px;padding:25px 0 27px;border-bottom:1px solid var(--rule);align-items:start}.category .num{font:normal 29px/1 var(--serif);color:var(--red2);padding-top:4px}.category h3 a{text-decoration:none}.category h3 a:hover{color:var(--red)}.category .description{color:#5e584c;max-width:660px;font-size:14px}.category .meta{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:right;padding-top:8px}.text-link{display:inline-block;text-decoration:none;border-bottom:1px solid var(--red2);color:var(--red);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding-bottom:2px;margin-top:7px}.text-link:hover{border-bottom-width:2px}.closing{padding:43px 0 58px;border-top:1px solid var(--rule);margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:70px}.closing blockquote{font:italic 24px/1.4 var(--serif);margin:0;color:#554b3d}.page-head{padding:55px 0 38px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:45px;align-items:end}.page-head h1{font:normal clamp(40px,5vw,62px)/1.02 var(--serif);letter-spacing:-.04em;margin:12px 0 17px}.page-head .dek{font:italic 19px/1.5 var(--serif);color:#5a5347;max-width:700px}.page-index{border-left:1px solid var(--rule);padding-left:20px;color:var(--muted);font-size:12px}.page-index b{display:block;font:normal 35px/1 var(--serif);color:var(--red2);margin-bottom:8px}.page-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;padding:38px 0 60px}.side-index{border-right:1px solid var(--rule);padding-right:24px}.side-index .label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:13px}.side-index a{display:block;text-decoration:none;font-size:13px;line-height:1.4;padding:9px 0;border-bottom:1px solid rgba(185,173,149,.65)}.side-index a:hover{color:var(--red)}.content-section{padding:0 0 34px;margin:0 0 34px;border-bottom:1px solid var(--rule)}.content-section:last-child{border-bottom:0}.content-section h2{font-size:29px}.content-section p{max-width:760px}.register{margin-top:22px;border-top:1px solid var(--rule)}.record-row{display:grid;grid-template-columns:48px minmax(0,1fr) 110px;gap:17px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}.record-row .record-no{font:normal 22px/1.2 var(--serif);color:var(--red2)}.record-row h3{font-size:20px}.record-row p{font-size:13px;color:#625b4f;margin:0;max-width:650px}.record-row .status{text-align:right;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:6px}.record-row button{background:none;border:0;border-bottom:1px solid var(--red2);padding:0 0 2px;margin-top:8px;color:var(--red);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.record-row button:hover{border-bottom-width:2px}.notice{background:rgba(255,252,243,.38);border-left:2px solid var(--red2);padding:17px 21px;margin:20px 0;max-width:760px;font-size:13px}.notice strong{font-family:var(--serif);font-size:17px;font-weight:normal;display:block;margin-bottom:4px}.record-detail{display:none;padding:20px 22px;background:rgba(255,252,243,.45);border-bottom:1px solid var(--rule);font-size:13px}.record-detail.open{display:block}.record-detail h4{font:normal 19px var(--serif);margin:0 0 6px}.record-detail dl{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;margin:15px 0 0}.record-detail dt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.record-detail dd{margin:0;line-height:1.65}.record-detail li{margin:0 0 7px}.record-detail a{color:var(--red)}.colophon{padding:27px 0 35px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.colophon strong{font-weight:normal;color:var(--red)}.back{display:inline-block;margin-top:20px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--red);text-decoration:none;border-bottom:1px solid var(--red2)}.mobile-menu{display:none}
@media(max-width:760px){.frame{padding:0 22px}.masthead{align-items:flex-start}.edition{max-width:120px;font-size:9px}.nav button{font-size:10px;margin-right:15px;padding:11px 0}.hero{padding:48px 0 36px;grid-template-columns:1fr;gap:30px}.hero h1{font-size:54px}.seal{border-left:0;border-top:1px solid var(--rule);padding:20px 0 0;display:grid;grid-template-columns:60px 1fr;column-gap:15px}.seal .number{grid-row:span 2;font-size:42px}.seal strong{margin:0 0 5px}.intro-grid,.closing{grid-template-columns:1fr;gap:28px}.category{grid-template-columns:37px 1fr;gap:13px}.category .meta{grid-column:2;text-align:left;padding:0}.page-head{grid-template-columns:1fr;gap:22px;padding-top:42px}.page-index{border-left:0;border-top:1px solid var(--rule);padding:13px 0 0;display:flex;gap:12px;align-items:center}.page-index b{font-size:26px;margin:0}.page-body{grid-template-columns:1fr;gap:28px;padding-top:25px}.side-index{border-right:0;border-bottom:1px solid var(--rule);padding:0 0 20px}.side-index nav{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.record-row{grid-template-columns:32px 1fr;gap:12px}.record-row .status{grid-column:2;text-align:left;padding-top:0}.record-detail dl{grid-template-columns:1fr;gap:3px}.record-detail dd{margin-bottom:9px}.colophon{flex-direction:column;gap:8px}.section-head{align-items:flex-start;flex-direction:column;gap:5px}}

<header><div class="frame"><div class="masthead"><a href="#home" class="brand" data-page="home">The Book of Observances<span>A compilation of the Keepers</span></a><div class="edition">An old record<br>Preserved without addition</div></div><nav class="nav" aria-label="Main navigation" id="mainNav"></nav></div></header>
<main class="frame" id="app" tabindex="-1"></main>
<footer class="frame"><div class="colophon"><span><strong>The Book of Observances</strong> · Keeper compilation</span><span>Names unrecorded · Accounts preserved</span></div></footer>
<script>
const categories=[
{id:'healing',num:'I',name:'Healing and Restoration',short:'The return of what has been weakened, disturbed, or lost.',dek:'Observances concerned with recovery, renewal, and the restoration of spiritual condition.',intro:'This division gathers accounts of observances undertaken when spiritual strength has diminished, balance has been disturbed, or a person’s awareness and abilities have been impaired. The records describe practices intended to restore what can be restored, and distinguish those conditions for which the outcome remains uncertain.',scope:'The accounts are arranged by the condition an observance is meant to address, rather than by the House in which it is practised. Similar purposes do not necessarily indicate identical methods. Requirements, participants, materials, and limits belong to each individual record.',subjects:[
['Restoration of spiritual strength','Observances recorded for states of spiritual exhaustion, depletion, or diminished capacity.'],
['Restoration of spiritual balance','Practices associated with a spiritual condition understood to have fallen out of balance.'],
['Recovery from spiritual afflictions','Accounts concerning recovery from spiritual disturbances or afflictions.'],
['Restoration of awareness and ability','Records involving disturbed spiritual awareness, impaired abilities, or damaged spiritual connections.'],
['Recovery following an observance','Accounts of lingering effects after an observance, including cases in which the intended result was incomplete.'],
['Restoration following spiritual intrusion','Records concerning recovery after an unwanted spiritual presence or intrusion, including weakened or severed bonds.']],note:'A record of intended restoration is not proof that restoration will always occur. Where no failure is known, the archive says so only as far as the surviving accounts permit.'},
{id:'protection',num:'II',name:'Protection and Preservation',short:'The keeping safe of persons, places, bonds, and spiritual conditions.',dek:'Observances concerned with guarding, maintaining, and preserving against spiritual harm or disruption.',intro:'This division gathers accounts of observances undertaken to protect what is considered vulnerable, to preserve an existing condition, or to maintain a boundary against disturbance. The record attends to what an observance is meant to safeguard, the circumstances in which protection is sought, and the limits that have been observed.',scope:'Protection is not treated as a single method or a guarantee of safety. The form and reach of an observance are recorded separately in each account, where known. A practice that guards one person, place, or bond should not be assumed to serve another purpose without evidence.',subjects:[['Protection of persons','Observances intended to guard an individual against spiritual danger or disturbance.'],['Safeguarding places','Records concerning the protection or preservation of a dwelling, site, or place of spiritual importance.'],['Preservation of spiritual bonds','Practices intended to maintain a connection, allegiance, or bond against disruption.'],['Warding and boundaries','Accounts of observances that establish or maintain a spiritual boundary.'],['Continuance of protection','Records concerning the renewal, duration, or maintenance of an existing protection.'],['Limits and breaches','Accounts of protections that weakened, were crossed, or did not produce a known result.']],note:'The existence of a protective observance does not establish the extent of its protection. Each account must be read according to its recorded purpose and evidence.'},
{id:'communion',num:'III',name:'Communion and Invocation',short:'The seeking of contact, response, or presence beyond the self.',dek:'Observances concerned with calling, addressing, or seeking communion with spiritual presences.',intro:'This division gathers accounts of observances through which practitioners seek to address, call upon, or enter communion with a spiritual presence. The records distinguish the intended recipient, the purpose of the approach, and what—if anything—was observed in response.',scope:'An invocation is not, by itself, evidence of an answer. The archive records reported signs and outcomes without treating expectation as confirmation. Where the identity of a presence, the nature of a response, or the success of an observance remains uncertain, that uncertainty is retained.',subjects:[['Invocation and calling','Accounts of observances intended to call or address a spiritual presence.'],['Seeking communion','Practices intended to establish or enter a form of spiritual communication.'],['Requests and petitions','Observances through which a practitioner seeks aid, permission, guidance, or intervention.'],['Receiving a response','Records concerning signs interpreted as answers, including the limits of such interpretations.'],['Witness and mediation','Accounts in which another person, role, or spiritual intermediary is involved.'],['Silence and uncertain outcomes','Records where no response was observed, or where the outcome could not be established.']],note:'The archive distinguishes what a practitioner sought, what witnesses observed, and what later accounts concluded. These are not always the same.'},
{id:'passage',num:'IV',name:'Passage and Transition',short:'The marking of thresholds, departures, and changes of state.',dek:'Observances associated with crossing from one condition, status, or stage into another.',intro:'This division gathers accounts of observances connected with passage: moments in which a person, bond, or condition is understood to cross a threshold or undergo a significant change. Such records may concern preparation, the passage itself, or the recognition of a transition after it has occurred.',scope:'The archive does not assume that every transition follows the same order or carries the same meaning across the Spiritual Houses. Each record preserves the tradition and circumstances observed, while leaving unrecorded what cannot be established from surviving accounts.',subjects:[['Preparation for passage','Observances performed before a recognised transition or crossing.'],['Rites of transition','Accounts of practices marking a change of state, standing, or spiritual condition.'],['Crossing thresholds','Records associated with boundaries between places, conditions, or stages.'],['Departure and separation','Observances connected with leaving, parting, or the ending of a former state.'],['Arrival and recognition','Practices through which a transition or new condition is acknowledged.'],['Interrupted or uncertain passage','Accounts in which a transition was delayed, incomplete, or not clearly understood.']],note:'The word “passage” follows the terminology of the recorded tradition. It does not, on its own, establish what lies beyond a threshold or what a transition will bring.'},
{id:'reconciliation',num:'V',name:'Reconciliation and Release',short:'The mending of division and the loosening of what remains bound.',dek:'Observances concerned with restoring accord, easing a bond, or bringing a spiritual matter to its close.',intro:'This division gathers accounts of observances intended to address spiritual discord, restore a damaged accord, release a bond, or bring an unresolved condition to an end. The records preserve the stated purpose of each practice without assuming that reconciliation, release, and separation are interchangeable outcomes.',scope:'An observance may seek repair, closure, or release, and these purposes need not produce the same result. Where an account does not establish whether a bond was restored, loosened, or ended, the record leaves that distinction unresolved.',subjects:[['Restoring accord','Practices intended to address a spiritual disagreement or restore a disrupted relationship.'],['Mending damaged bonds','Accounts concerning a spiritual connection understood to have been strained or harmed.'],['Release from a bond','Observances intended to loosen or end a binding connection.'],['Resolution of lingering influence','Records concerning the easing or conclusion of an ongoing spiritual effect.'],['Closure and completion','Practices marking the conclusion of an unresolved spiritual matter.'],['Failed or incomplete reconciliation','Accounts in which accord or release was not achieved, or the result remains unknown.']],note:'A record of intended release does not establish that every bond can be ended, just as an attempt at reconciliation does not establish that accord was restored.'}
];
const observanceRecords = {"healing": [{"title": "The Returning Breath", "purpose": "A restorative observance for a person whose spiritual strength has been depleted by grief, prolonged exertion, or a demanding rite.", "who": "A trained Keeper or recognised household practitioner; the person receiving the observance must consent and remain able to rest.", "materials": "A bowl of clean water, an unlit lamp, a plain cloth, and a quiet room. No rare ingredient is required.", "procedure": "The practitioner asks the person what they wish to regain, washes their own hands, and places the bowl between them. Three measured pauses are kept in silence; the person then names one ordinary task they feel ready to return to. The lamp is lit only after the conversation, as a sign of renewed intention.", "signs": "The tradition regards a calm return to ordinary activity as encouraging, not as proof of supernatural change. Witnesses may record improved steadiness, no noticeable change, or an uncertain result.", "variants": "Some Houses use a shared spoken blessing; others keep the pauses silent. The record does not prescribe a fixed prayer.", "failure": "No immediate change is recorded in several accounts. The observance is not repeated in quick succession merely to force a result.", "consequences": "The principal consequence is a formal period of rest and support. The archive warns that spiritual language must not replace ordinary care when a person is ill or exhausted.", "inspiration": "Water-based purification and quiet prayer across several traditions; adapted as a fictional rite, not a claim about one religion."}, {"title": "The Level Vessel", "purpose": "A practice intended to restore balance when a person describes their spiritual condition as scattered, uneven, or difficult to govern.", "who": "A Keeper trained in listening and observation, with one willing participant.", "materials": "A shallow vessel, water, two smooth stones, and a level surface.", "procedure": "The stones are placed on opposite sides of the vessel. The participant describes what feels unsettled; the practitioner moves neither stone until the account is finished. The vessel is then set level and the participant chooses one manageable action to bring order to the coming day.", "signs": "The water remaining still is treated as a visual metaphor, not a divination. The recorded outcome is the participant’s own account of whether the exercise clarified their next step.", "variants": "In some regions, a second witness keeps the account; elsewhere, the rite is private.", "failure": "If the participant finds the symbolism distressing or unhelpful, the practice ends without interpretation.", "consequences": "No status is lost through an inconclusive result. A Keeper may record that balance was sought but not established.", "inspiration": "Water symbolism and contemplative ritual; fictionalised around balance rather than a borrowed liturgy."}, {"title": "The Quiet Lamp", "purpose": "A supportive rite for recovery after a prolonged spiritual affliction, especially when the person feels overwhelmed by attention or repeated questioning.", "who": "One trusted practitioner and the person receiving support; additional witnesses are excluded unless invited.", "materials": "A lamp or candle used safely, a chair, and a written record kept only with permission.", "procedure": "The room is made quiet. The practitioner explains each step before beginning and asks permission before lighting the lamp. The participant may speak, remain silent, or stop the rite at any time. At its close, the lamp is extinguished and a practical plan for rest or companionship is agreed.", "signs": "The sign sought is not a vision or dramatic event but whether the participant feels able to choose what happens next. The archive records their words without embellishment.", "variants": "Some Houses use a window lamp instead of an open flame; others use a symbolic light with no flame.", "failure": "A participant who feels worse may end the rite immediately. No claim is made that distress proves an affliction is present.", "consequences": "The record calls for privacy and follow-up by trusted people. It forbids public display of another person’s suffering as evidence of a Keeper’s power.", "inspiration": "Ritual light, care, and witness practices; fictional and deliberately non-diagnostic."}, {"title": "The Unknotted Thread", "purpose": "An observance for people who believe a spiritual connection has become strained or difficult to understand.", "who": "A practitioner and the person concerned; another party participates only by invitation.", "materials": "A length of ordinary thread and a page on which the participant may write or draw.", "procedure": "The participant ties a loose knot while naming what they can describe with confidence. They then identify what remains uncertain. The knot is loosened—not cut—while the practitioner repeats the distinction between known facts and fears. The thread is kept or discarded by the participant.", "signs": "A clearer account of what is known and unknown is the only expected sign. The thread itself is not treated as proof of a spiritual bond.", "variants": "A private version uses no witness; a communal version may include a trusted mediator.", "failure": "If the connection involves coercion or danger, the archive advises prioritising safety and outside support over reconciliation.", "consequences": "The rite can help organise a narrative but cannot guarantee healing, restore a bond, or establish what another person thinks.", "inspiration": "Symbolic untying and reflective confession, found in broad ritual motifs; adapted without borrowing a sacred formula."}, {"title": "The After-Rite Vigil", "purpose": "A period of observation following a demanding observance when its effects have not yet settled.", "who": "The original practitioner, a second Keeper when available, and the participant’s chosen support person.", "materials": "A dated log, drinking water, and a place to rest.", "procedure": "For a defined interval chosen according to the original rite, the Keepers record sleep, mood as reported, unusual events, and practical disruptions without forcing an explanation. They do not repeat the original rite during the observation period unless its established rules explicitly require it.", "signs": "The sign is a reliable account over time, including ordinary explanations and no change. A single coincidence is not treated as proof.", "variants": "The length of the vigil varies by the original rite; the register leaves it unspecified where no precedent survives.", "failure": "If the participant becomes unwell or unsafe, ordinary medical or emergency help takes priority over completing the record.", "consequences": "The archive may classify the outcome as settled, unresolved, or adverse. The record must preserve contradictory witness accounts.", "inspiration": "Observation logs and post-ceremony reflection; an original fictional archival procedure."}, {"title": "The Open Threshold", "purpose": "A recovery observance for a person who believes an unwanted spiritual influence has disrupted their sense of safety or belonging.", "who": "A trusted Keeper and the participant; the participant chooses whether the door remains open and who is present.", "materials": "A clean cloth, a bowl of water, and a clearly marked doorway.", "procedure": "The practitioner asks what would help the participant feel in control of the space. The cloth is placed beside the threshold, and the participant chooses whether to cross it, remain where they are, or end the rite. The water is poured away normally after the session.", "signs": "The central sign is restored choice and a clearly agreed boundary, not the appearance or disappearance of an unseen entity.", "variants": "Some Houses conduct the rite at a window or garden gate. No single location is universal.", "failure": "No practitioner may insist that a person is possessed or contaminated because they feel frightened.", "consequences": "The participant may request changes to their room, routine, or company. The record distinguishes subjective relief from any claim of verified spiritual intrusion.", "inspiration": "Threshold symbolism and cleansing rites; fictional adaptation with explicit uncertainty."}], "protection": [{"title": "The Witnessed Name", "purpose": "A protective observance that places a person’s chosen name in a community record so that their safety and welfare are not forgotten.", "who": "A Keeper and two witnesses chosen by the person named; minors and vulnerable people require appropriate trusted support.", "materials": "A bound register, ink, and a mark chosen by the person.", "procedure": "The name is written only with permission. The witnesses state what support they can realistically offer, and the Keeper records the limits of that promise. The entry is reviewed at an agreed time and may be withdrawn when appropriate.", "signs": "The sign of completion is a clear record and a workable support agreement, not an invisible shield.", "variants": "Some Houses keep the register publicly in a sanctuary; others restrict access to appointed Keepers.", "failure": "If witnesses cannot fulfil their promises, the entry is corrected rather than left as false assurance.", "consequences": "The rite creates accountability and belonging. It cannot guarantee safety from every harm.", "inspiration": "Communal vows and memorial registers; fictionalised as a protective social covenant."}, {"title": "The Four Boundaries", "purpose": "A rite for marking the limits of a room, meeting place, or sacred site before an observance begins.", "who": "A Keeper responsible for the place and any people whose access may be affected.", "materials": "Four small stones or markers and a plan of the space.", "procedure": "The markers are placed at the agreed limits. The Keeper names what the boundary is for, who may enter, and how permission can be requested. The boundary is then recorded in plain language so no one must rely on an ambiguous sign.", "signs": "The record of the boundary and participants’ understanding of it are the indicators of completion.", "variants": "Markers may be replaced by knots, chalk, or other locally accepted symbols.", "failure": "The rite is not used to confine a person against their will or to conceal a hazard.", "consequences": "The boundary is respected until it is formally changed. A broken marker triggers review, not automatic blame or accusation.", "inspiration": "Consecrated space and boundary symbolism across religious practice; fictionalized for the Keeper tradition."}, {"title": "The Kept Ember", "purpose": "A preservation rite for an ongoing duty, promise, or communal practice that must be maintained over time.", "who": "A Keeper and the next person entrusted with the duty.", "materials": "A covered lamp, a written handover note, and a safe substitute symbol where fire is unsuitable.", "procedure": "The outgoing Keeper describes the duty, its limits, and any unfinished work. The incoming Keeper repeats the parts they understand and may refuse responsibilities they cannot accept. The light is then covered or replaced by its symbol.", "signs": "The rite is complete when responsibility has been understood and accepted without coercion.", "variants": "The ember is metaphorical in Houses where an open flame is impractical or unsafe.", "failure": "If no successor is ready, the record remains open and the duty is scaled back rather than falsely declared preserved.", "consequences": "The handover protects continuity but makes no claim that a vow will remain unbroken by magic.", "inspiration": "Perpetual-light and succession symbolism; invented for the archive."}, {"title": "The Quieting of the Gate", "purpose": "A warding observance for closing a meeting place after a period of spiritual work.", "who": "The Keeper responsible for the place and a second witness when possible.", "materials": "A key or door-token and a closing entry in the site log.", "procedure": "The Keeper checks that everyone has left voluntarily, confirms that no one is being excluded from a place they have a right to use, and states that the meeting is ended. The door is closed and the time recorded.", "signs": "A clear ending and a secure, ordinary space are the signs of completion.", "variants": "In outdoor sites, a spoken closing replaces a locked door.", "failure": "If a person remains and needs help, the closure pauses until their immediate needs are addressed.", "consequences": "The practice distinguishes the end of a rite from the abandonment of participants.", "inspiration": "Closing prayers and sanctuary stewardship; fictionalized as a practical warding rite."}, {"title": "The Returning Mark", "purpose": "A renewal practice for a protection whose terms, scope, or responsible Keeper have changed.", "who": "The person or group protected and the Keeper responsible for the original record.", "materials": "The original entry, a new date, and a fresh mark chosen by those involved.", "procedure": "The Keeper reads the old terms aloud, asks what has changed, and replaces only the parts everyone understands and accepts. The new record links to the old one so the history is not erased.", "signs": "A consistent, updated record is the sign of renewal.", "variants": "Some Houses require two witnesses for communal protections; private protections may be witnessed by consent only.", "failure": "If the original terms cannot be recovered, the protection is marked uncertain rather than silently renewed.", "consequences": "Renewal does not retroactively prove the old protection worked.", "inspiration": "Renewal vows and maintenance of sacred commitments; fictional archival adaptation."}, {"title": "The Breach Account", "purpose": "A review performed when a boundary or protection appears to have failed.", "who": "A Keeper not solely responsible for the original protection, plus affected people who choose to contribute.", "materials": "The original record, a timeline of events, and space for separate witness accounts.", "procedure": "The review begins with what was observed, then separates observations from interpretation. Immediate practical risks are addressed first. The Keeper records possible explanations and any changes agreed upon.", "signs": "The sign of completion is an honest account with uncertainty retained where necessary.", "variants": "Some Houses conduct a private review to protect witnesses; others hold a communal hearing.", "failure": "The record must not name a culprit without evidence or treat a breach as proof of betrayal.", "consequences": "The protection may be revised, suspended, or retired. The archive preserves the failure so later Keepers can learn from it.", "inspiration": "Accountability after ritual failure; inspired by general traditions of communal review, not a copied rite."}], "communion": [{"title": "The Calling of the Listening Room", "purpose": "A formal observance for seeking guidance through prayer, meditation, or a carefully framed appeal to a spiritual presence.", "who": "A recognised Keeper and any participants who knowingly consent to the observance.", "materials": "A quiet room, a written question, and a time limit agreed in advance.", "procedure": "The question is written without demanding a particular answer. Participants sit in silence or use their House’s own prayer. At the end, the Keeper records what was actually experienced and separates it from later interpretation.", "signs": "A response may be reported, absent, or ambiguous. Silence is an accepted outcome and is not treated as proof of rejection.", "variants": "The words used differ by House; the archive does not prescribe a universal sacred formula.", "failure": "The rite stops if participants feel pressured to invent a message or agree with a leader’s interpretation.", "consequences": "No decision with serious consequences rests solely on an uncertain sign.", "inspiration": "Prayer, contemplation, and rites of communication; a fictional practice informed by comparative ritual scholarship."}, {"title": "The First Offering", "purpose": "A gratitude observance in which a community dedicates a small, ordinary gift to mark what it has received or hopes to honour.", "who": "A Keeper and the people who freely choose to contribute.", "materials": "A non-hazardous, locally appropriate offering such as bread, flowers, written thanks, or a crafted object.", "procedure": "The offering is named and its meaning explained. The Keeper states whether it will be shared, returned, composted, or kept. No person is required to give beyond their means.", "signs": "Completion is marked by the acknowledgement of the gift and its intended meaning, not by a guaranteed supernatural response.", "variants": "Some Houses share food after the rite; others use a symbolic object that is not consumed.", "failure": "An offering is declined if it is unsafe, coercive, or culturally inappropriate for the place.", "consequences": "The record notes the gift and its disposition. It does not claim that giving purchases divine favour.", "inspiration": "Gift exchange and votive offerings in varied traditions; adapted as a fictional, non-sacrificial rite."}, {"title": "The Petition of Three Questions", "purpose": "An observance for asking for guidance when a matter has several possible paths.", "who": "The petitioner and a Keeper who helps distinguish the question from the desired answer.", "materials": "A page divided into three parts: what is known, what is feared, and what remains to be asked.", "procedure": "The petitioner completes the three parts, then offers a prayer or sits in reflection according to their House. The Keeper reads the questions back without adding new claims. The petitioner decides what ordinary evidence or advice is needed next.", "signs": "The rite succeeds when the question becomes clearer; it does not require a vision, omen, or immediate answer.", "variants": "A group may offer reflections, but the petitioner retains responsibility for the decision.", "failure": "A Keeper may not claim exclusive access to the answer or use the rite to command another person.", "consequences": "The page may be revisited later to compare expectations with what actually occurred.", "inspiration": "Petitionary prayer and discernment; adapted into an original fictional framework."}, {"title": "The Answering Witness", "purpose": "A record-making practice used when a participant believes a sign or message has been received.", "who": "The participant and a witness who can listen without dictating the interpretation.", "materials": "A dated note recording the exact event, context, and the participant’s interpretation separately.", "procedure": "The participant describes the event in their own words. The witness asks what was directly observed and what meaning was assigned afterward. Both accounts are preserved if they differ.", "signs": "The sign is documented, not automatically authenticated. Independent evidence may be sought when the claim concerns the outside world.", "variants": "Some Houses preserve the participant’s account privately; others permit an anonymised entry in the register.", "failure": "If the account changes, the earlier version remains attached rather than erased.", "consequences": "The practice protects the archive from turning sincere belief into falsely certain history.", "inspiration": "Testimony and witness traditions; a fictional evidence protocol rather than a claim that spiritual messages are verifiable."}, {"title": "The Seat of the Mediator", "purpose": "An observance in which a trusted intermediary carries a request between a person and a community, House, or spiritual authority.", "who": "The petitioner, a mediator accepted by them, and the recipient if participation is possible.", "materials": "A written request and a record of what the mediator is authorised to disclose.", "procedure": "The mediator confirms the request’s wording and boundaries, delivers it without embellishment, and reports any response accurately. Private details are not shared beyond the permission granted.", "signs": "The sign of completion is that the request was conveyed and the response, if any, accurately returned.", "variants": "The mediator may be a spiritual office-holder or a trusted community member, depending on the House.", "failure": "A mediator who cannot remain neutral must disclose the conflict and step aside.", "consequences": "The rite cannot compel an answer or guarantee reconciliation.", "inspiration": "Intercession and mediation across religious and communal life; adapted for fictional Keeper institutions."}, {"title": "The Unanswered Bell", "purpose": "A closing observance for an invocation that produces no clear response.", "who": "The original participants and the Keeper who records the outcome.", "materials": "A bell or another ordinary signal, and the invocation record.", "procedure": "The Keeper sounds the signal once to mark the end of the waiting period. Participants state whether they observed anything, then leave without being asked to manufacture a meaning. The record is closed as unanswered or uncertain.", "signs": "The absence of a clear response is itself the recorded result.", "variants": "In quiet Houses, a hand gesture replaces the bell.", "failure": "Repeated calls are not made merely because participants dislike uncertainty.", "consequences": "The archive protects against escalating claims after silence. A future attempt requires a new purpose and fresh consent.", "inspiration": "Ritual closure and the role of silence; a fictional practice."}], "passage": [{"title": "The Washing Before Entry", "purpose": "A preparation rite for entering a recognised stage of training, service, or sacred duty.", "who": "The person entering the stage and an authorised Keeper; family or community witnesses attend only if invited.", "materials": "Clean water, a towel, and a written statement of the responsibilities being accepted.", "procedure": "The participant washes their hands or face as a symbolic transition. The Keeper explains the duties and limits of the new stage. The participant repeats the responsibilities in their own words and may ask for clarification before accepting.", "signs": "The rite is complete when consent and understanding are clear, not merely when the washing is finished.", "variants": "Some Houses use water, others use a clean cloth or another locally meaningful symbol.", "failure": "If the participant does not understand or freely accept the duty, the rite is postponed.", "consequences": "The person receives a new status only after the relevant community record is updated.", "inspiration": "Ablution and initiation motifs across traditions; the fictional rite does not reproduce a specific religion’s sacrament."}, {"title": "The Threshold Witness", "purpose": "A rite marking the moment someone leaves one recognised status and enters another.", "who": "The person undergoing the transition, a Keeper, and witnesses chosen by the person.", "materials": "Two markers representing the former and new status, plus a dated record.", "procedure": "The former status is named and honoured without ridicule. The person then crosses the marked threshold and states what they understand to be changing. The Keeper records both what is relinquished and what remains.", "signs": "Witnesses confirm that the transition was acknowledged; they do not dictate the participant’s inner feelings.", "variants": "The threshold may be a literal doorway, a path, or a line drawn on a page.", "failure": "A transition may be delayed when the person is not ready or a required condition has not been met.", "consequences": "The archive records the transition as complete, deferred, or disputed according to evidence.", "inspiration": "Liminality and rites of passage; adapted into an original ceremony."}, {"title": "The Leave-Taking Cup", "purpose": "A departure observance for a person leaving a household, school of practice, or long-held role.", "who": "The departing person and those they wish to include.", "materials": "A shared cup of water or another ordinary drink, with a record of any unfinished responsibilities.", "procedure": "Participants name one thing they received and one thing they leave behind. The departing person may offer a final message, then returns any entrusted objects and receives their own belongings. Sharing the drink is optional.", "signs": "The rite marks a clear ending and a practical handover. It does not require everyone to feel reconciled.", "variants": "A private departure may be conducted with one witness; a public departure may include the whole House.", "failure": "No one is required to speak publicly or disclose private reasons for leaving.", "consequences": "The person’s departure is recorded without erasing their prior contributions.", "inspiration": "Farewell meals and transition ceremonies; fictional adaptation."}, {"title": "The Recognition of Arrival", "purpose": "A welcoming rite for a person entering a new community or arriving after a long absence.", "who": "The newcomer and a host or Keeper; participation is voluntary.", "materials": "A place at the table, a name card or token, and an explanation of community customs.", "procedure": "The host names the place being offered and explains relevant rules plainly. The newcomer is invited to state their preferred form of address and any boundaries they wish respected. The token is offered, not imposed.", "signs": "The sign is informed welcome: the newcomer knows whom to ask for help and what expectations apply.", "variants": "Some Houses share a meal; others use a short greeting or a tour of the space.", "failure": "If the community cannot safely accommodate a need, it must say so honestly rather than promise what it cannot provide.", "consequences": "The record marks the date of arrival and any agreed support, with privacy respected.", "inspiration": "Hospitality and incorporation rites; fictionalised as a community practice."}, {"title": "The Interrupted Crossing", "purpose": "A formal record for a passage that was postponed, interrupted, or left incomplete.", "who": "The participant and a Keeper who was not solely responsible for arranging the passage.", "materials": "The original plan and a note of the reason for interruption, where the participant wishes to record it.", "procedure": "The Keeper marks the point reached, what remains undone, and whether any part must be repeated. The participant is asked what support or time they need. No one declares the passage failed merely because it paused.", "signs": "A clear status—paused, resumed, abandoned, or unresolved—is the sign of a sound record.", "variants": "Houses differ on whether a partially completed rite can be resumed or must begin again.", "failure": "The participant may withdraw from the process. The archive does not treat withdrawal as moral failure.", "consequences": "Any status or responsibility dependent on completion remains unchanged until the relevant requirements are met.", "inspiration": "The flexible treatment of transitions and liminal states; original fictional archival procedure."}, {"title": "The Second Naming", "purpose": "A rite recognising a change in public role, chosen title, or recognised identity within the Keeper community.", "who": "The person being named and the authority responsible for the relevant register; witnesses are included by consent.", "materials": "The existing record, the requested name or title, and a statement of what does and does not change.", "procedure": "The Keeper confirms the person’s chosen form and explains any administrative consequences. The new name is spoken if the person wishes, entered into the record, and linked to the former entry only where necessary.", "signs": "Completion is shown by consistent use of the new name in the community record.", "variants": "Some Houses make the rite private; others use a public announcement.", "failure": "A request is not delayed for spectacle, and a former name is not announced against the person’s wishes.", "consequences": "The archive preserves continuity without treating a change of name as a change in the person’s worth.", "inspiration": "Naming ceremonies and status recognition; adapted as a fictional rite with emphasis on consent."}], "reconciliation": [{"title": "The Plain Account", "purpose": "A reconciliation observance for people who wish to address a disagreement by separating facts, interpretations, and unanswered questions.", "who": "The people directly involved and a mediator accepted by all; participation is voluntary.", "materials": "A shared record divided into what each person observed, what each inferred, and what each still needs to know.", "procedure": "Each person speaks without interruption for an agreed time. The mediator records statements in the speaker’s own terms and asks for corrections. No apology or agreement is demanded before everyone has been heard.", "signs": "Completion means that the accounts have been heard accurately, not that all parties agree.", "variants": "Some Houses use a written exchange when face-to-face discussion is not suitable.", "failure": "The rite is not used where a joint meeting would place someone at risk; separate support takes priority.", "consequences": "The record may identify a next step, a boundary, or a decision not to continue contact.", "inspiration": "Confession, testimony, and restorative dialogue; fictionalised as a Keeper practice."}, {"title": "The Mending Cord", "purpose": "A symbolic rite for a bond that its participants wish to repair after a rupture.", "who": "All people whose participation is symbolised by the cord must consent.", "materials": "A cord with a visible join and a written statement of what each participant is willing to do differently.", "procedure": "The participants examine the broken cord and name what repair would require in practical terms. If they agree, the join is tied; if not, the cord remains separated and the disagreement is recorded honestly.", "signs": "A repaired cord signifies an agreement to attempt repair, not proof that trust has already returned.", "variants": "A person may choose a written symbol instead of a shared object.", "failure": "No one is pressured to forgive, reunite, or resume a relationship.", "consequences": "The participants may set a review date and may end the process if the agreement is not honoured.", "inspiration": "Knot and binding symbolism; invented for the archive and not a claim about any specific community."}, {"title": "The Unbinding of Consent", "purpose": "A release observance for a promise, role, or spiritual commitment that a person is permitted to leave.", "who": "The person seeking release and the Keeper authorised to amend the original record.", "materials": "The original promise or bond record and a statement of the terms for release.", "procedure": "The Keeper reads the original terms, explains any legitimate obligations that remain, and asks the person to state their decision. The record is amended to show what ends and what continues. No dramatic gesture is required.", "signs": "A clear and properly recorded release is the sign of completion.", "variants": "Some Houses require witnesses for public offices; private commitments may have different rules.", "failure": "A Keeper may not claim that a person is spiritually trapped simply because they wish to leave.", "consequences": "The person is no longer held to the released commitment, though ordinary responsibilities are settled transparently.", "inspiration": "Release and vow-renewal traditions; fictionalised with explicit limits on authority."}, {"title": "The Clearing of the Table", "purpose": "A communal observance for bringing a shared dispute to a defined pause or conclusion.", "who": "The people affected and a facilitator; a shared meal is optional and never a condition of forgiveness.", "materials": "A table, a written summary of decisions, and a list of outstanding matters.", "procedure": "The parties place the issue—not personal tokens—at the centre of the table as a symbol. They agree what has been decided, what remains open, and when discussion will resume or end. The summary is read back for accuracy.", "signs": "The sign is a shared understanding of the next step, even where feelings remain unresolved.", "variants": "The table may be literal or represented by a page in a private mediation.", "failure": "No participant is forced to share food, touch another person, or make a public apology.", "consequences": "The written agreement can be reviewed if circumstances change. The ritual does not erase harm or prevent lawful accountability.", "inspiration": "Communal meals and reconciliation ceremonies; fictional adaptation."}, {"title": "The Record of Lingering Influence", "purpose": "A review for a situation in which an old vow, grievance, or spiritual event is believed to continue affecting present decisions.", "who": "A Keeper trained to document testimony and the person requesting the review.", "materials": "Prior records, dated observations, and a separate list of present-day concerns.", "procedure": "The Keeper compares the old account with current evidence and asks which effects are directly observable. Any symbolic interpretation is recorded separately. The participant identifies which practical issue they want to address first.", "signs": "A more precise account of the continuing problem is the desired result; no supernatural cause is presumed.", "variants": "A second Keeper may review the entry when the original Keeper has a conflict of interest.", "failure": "The review cannot be used to assign blame without evidence or to discourage ordinary professional support.", "consequences": "The archive may recommend a new boundary, a mediated conversation, or simply preserving uncertainty.", "inspiration": "Expiation and continuing-obligation motifs; a fictional critical-review rite."}, {"title": "The Closing of the Matter", "purpose": "A final observance for formally closing a dispute or spiritual concern after its agreed process has ended.", "who": "The person or group responsible for the record and any participants who wish to attend.", "materials": "The original file, a closing statement, and a method for reopening the matter if new evidence appears.", "procedure": "The Keeper summarises what was established, what actions were taken, and what remains unknown. Participants may offer a final statement or decline. The file is dated and closed, with conditions for reopening stated plainly.", "signs": "The sign is an accurate closure record, not universal forgiveness or emotional resolution.", "variants": "A communal matter may close in public; sensitive matters remain private.", "failure": "A closing rite does not block someone from seeking help or reporting new harm.", "consequences": "The matter is archived as resolved, partly resolved, or unresolved. The distinction is retained.", "inspiration": "Closing rites and formal reconciliation; original fictional procedure."}]};
let current='home';
const app=document.getElementById('app'), nav=document.getElementById('mainNav');
function makeNav(){nav.innerHTML='<button data-page="home" class="'+(current==='home'?'active':'')+'">The Register</button>'+categories.map(c=>'<button data-page="'+c.id+'" class="'+(current===c.id?'active':'')+'">'+c.num+'. '+c.name+'</button>').join('');}
function home(){return `<section class="hero"><div><div class="eyebrow">The Keeper's compilation · Thirty records preserved</div><h1>The Book of<br>Observances</h1><p class="dek">A record of spiritual practices gathered through observation and preserved across centuries.</p></div><aside class="seal"><div class="number">∞</div><div><strong>Names unrecorded.<br>Work preserved.</strong><p>The compilation stands as it was left. No further accounts have been entered since its completion.</p></div></aside></section>
<section class="intro-grid"><div><div class="eyebrow">On this record</div><h2>What has been kept</h2><p>The practices recorded herein were gathered through observation and preserved in the writings of the Keepers across centuries. Within this compilation are set down the observances of the Spiritual Houses, the manners of their performance, and the purposes for which they are undertaken. The entries preserve not only what a rite is meant to accomplish, but also who may perform it, how it is recorded, and what remains uncertain.</p><p>These writings were gathered by those who came before, their names unrecorded, their work preserved. The compilation preserves thirty observance records arranged under five divisions. Each account is kept with its limits, variations, and uncertain outcomes intact.</p></div><div><div class="eyebrow">How it is arranged</div><h2>By purpose, not by origin</h2><p>The register is divided according to the purpose an observance is meant to serve. Practices found in one House may also be known elsewhere; their presence in a division does not imply that the practice belongs exclusively to a single people or place.</p><p>Each account is preserved according to what was observed or reported. Known variations are distinguished where the record allows it. Matters not established by the surviving accounts remain uncertain.</p><div class="notice"><strong>A note on the limits of the record</strong>The absence of an account is not proof that a practice does not exist. Nor does a recorded intention guarantee a particular outcome.</div></div></section>
<section><div class="section-head"><div><div class="eyebrow">The register</div><h2>Divisions of observance</h2></div><span class="count">Five divisions · 30 observance records</span></div><div class="category-list">${categories.map(c=>`<article class="category"><div class="num">${c.num}</div><div><h3><a href="#${c.id}" data-page="${c.id}">${c.name}</a></h3><p class="description">${c.short} ${c.dek}</p><a class="text-link" href="#${c.id}" data-page="${c.id}">Enter division</a></div><div class="meta">Division ${c.num}<br>Subject register</div></article>`).join('')}</div></section>
<section class="closing"><blockquote>“Thus stands the record, as it was left to those who would come after.”</blockquote><div><div class="eyebrow">Preservation</div><h2>What is known, and what is not</h2><p>The Keepers’ task was to observe and preserve, not to complete every account. Some practices are recorded in detail; others survive only in fragments. A failure may be known, a success may be reported, or no outcome may have been witnessed at all.</p><p class="smallnote">The record retains these distinctions. It does not supply certainty where none was preserved.</p></div></section>`}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function categoryPage(c){const recs=observanceRecords[c.id]||[];return `<section class="page-head"><div><div class="eyebrow">Division ${c.num} · The Book of Observances</div><h1>${c.name}</h1><p class="dek">${c.dek}</p></div><aside class="page-index"><b>${c.num}</b><span>Division of the<br>Keeper's register</span></aside></section>
<div class="page-body"><aside class="side-index"><div class="label">Within this division</div><nav>${[['overview','Purpose of the division'],['subjects','Subject register'],['limits','Limits of the record'],['sources','Comparative notes']].map(([id,label])=>`<a href="#${id}">${label}</a>`).join('')}</nav><a class="back" href="#home" data-page="home">Return to register</a></aside><div class="page-content">
<section class="content-section" id="overview"><div class="eyebrow">Purpose of the division</div><h2>On ${c.name.toLowerCase()}</h2><p>${c.intro}</p><p>${c.scope}</p><div class="notice"><strong>On the Keeper's method</strong>The register distinguishes intended purpose, reported experience, witness testimony, and established outcome. A ritual's presence in the archive does not prove that every claimed effect is real or repeatable.</div></section>
<section class="content-section" id="subjects"><div class="eyebrow">Subject register</div><h2>Observances and surviving accounts</h2><p class="smallnote">Each entry below is a fictional observance developed for this archive from broad comparative themes in religious and ceremonial life. Expand an entry to read its record.</p><div class="register">${c.subjects.map((s,i)=>{const r=recs[i]||{};const id=c.id+'-'+i;return `<article class="record-row"><div class="record-no">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(r.title||s[0])}</h3><p>${esc(r.purpose||s[1])}</p><button aria-expanded="false" data-detail="${id}">Open observance record</button></div><div class="status">${esc(s[0])}<br>Keeper's entry</div></article><div class="record-detail" id="detail-${id}"><h4>${esc(r.title||s[0])}</h4><p>${esc(r.purpose||s[1])}</p><dl><dt>Practitioners and participants</dt><dd>${esc(r.who||'Recorded according to the local House custom.')}</dd><dt>Materials and requirements</dt><dd>${esc(r.materials||'No special material is required unless a local record specifies otherwise.')}</dd><dt>Procedure</dt><dd>${esc(r.procedure||'The surviving account does not preserve a full procedure.')}</dd><dt>Signs and outcomes</dt><dd>${esc(r.signs||'The outcome is recorded as uncertain unless supported by testimony.')}</dd><dt>Variations between Houses</dt><dd>${esc(r.variants||'No universal form is established.')}</dd><dt>Failure and interruption</dt><dd>${esc(r.failure||'Incomplete results are recorded without assigning blame.')}</dd><dt>Consequences and limits</dt><dd>${esc(r.consequences||'The entry makes no guarantee of a particular result.')}</dd><dt>Comparative inspiration</dt><dd>${esc(r.inspiration||'Original fictional development informed by comparative ritual study.')}</dd><dt>Archive status</dt><dd>Fictional Keeper record; its stated outcomes are part of the worldbuilding, not claims about real-world supernatural efficacy.</dd></dl></div>`}).join('')}</div></section>
<section class="content-section" id="limits"><div class="eyebrow">The surviving evidence</div><h2>Limits of the record</h2><p>${c.note}</p><div class="notice"><strong>On incomplete accounts</strong>Where a detail was not observed or no account survives, the record states that the matter is unknown. A report of success, a report of failure, and an absence of testimony remain distinct kinds of evidence.</div><p class="smallnote">Individual entries identify practitioners, participants, materials, procedure, signs, variations, failure, and consequences where the fictional record establishes them. No entry is treated as universally effective, and consent or ordinary safety is never overridden by ritual authority.</p></section>
<section class="content-section" id="sources"><div class="eyebrow">Comparative notes</div><h2>Sources of inspiration</h2><p>The archive draws on broad, publicly documented patterns in comparative religious studies: purification through washing and symbolic cleansing; ritual as repeated action involving words, gestures, objects, and community; rites that mark changes of status; practices of prayer and communication; offerings and shared gifts; and religious approaches to confession, forgiveness, and reconciliation. The fictional observances above are original adaptations, not descriptions of a single real-world religion.</p><ul class="smallnote"><li><a href="https://www.encyclopedia.com/philosophy-and-religion/other-religious-beliefs-and-general-terms/religion-general/purification" target="_blank" rel="noopener">Encyclopedia.com — “Purification”</a>: purification, renewal, boundaries, and ritual symbolism.</li><li><a href="https://www.encyclopedia.com/social-sciences-and-law/anthropology-and-archaeology/anthropology-terms-and-concepts/ritual" target="_blank" rel="noopener">Encyclopedia.com — “Ritual”</a>: ritual action, communication, offerings, healing, and communal identity.</li><li><a href="https://www.encyclopedia.com/social-sciences-and-law/economics-business-and-labor/businesses-and-occupations/reconciliation" target="_blank" rel="noopener">Encyclopedia.com — “Reconciliation”</a>: distinctions between forgiveness and restoring a relationship.</li></ul><p class="smallnote">These sources are comparative starting points. Practices within living religions are diverse and context-specific; the archive does not claim that all communities practise the same rites or assign them the same meanings.</p></section>
</div></div>`}
function render(page){current=page;makeNav();app.innerHTML=page==='home'?home():categoryPage(categories.find(c=>c.id===page)||categories[0]);app.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){e.preventDefault();render(p.dataset.page);history.replaceState(null,'','#'+p.dataset.page);return;}const d=e.target.closest('[data-detail]');if(d){const el=document.getElementById('detail-'+d.dataset.detail);const open=el.classList.toggle('open');d.setAttribute('aria-expanded',String(open));d.textContent=open?'Close subject note':'Open subject note';}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='home'||categories.some(c=>c.id===id))render(id||'home')});
render(categories.some(c=>c.id===location.hash.slice(1))?location.hash.slice(1):'home');
</script></body></html>
